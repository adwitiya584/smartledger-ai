server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.flyway.enabled=false

app.jwt.secret=${APP_JWT_SECRET:paisanest_super_secret_jwt_key_2026_min32chars}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}

app.groq.api-key=${APP_GROQ_API_KEY:placeholder}
app.razorpay.key-id=${APP_RAZORPAY_KEY_ID:placeholder}
app.razorpay.key-secret=${APP_RAZORPAY_KEY_SECRET:placeholder}

app.trial.hours=52

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:placeholder}
spring.mail.password=${SPRING_MAIL_PASSWORD:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}